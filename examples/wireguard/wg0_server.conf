# WireGuard server configuration
# Place at /etc/wireguard/wg0.conf on the Linux server
#
# Generate keys:
#   wg genkey | tee /etc/wireguard/server_private.key | wg pubkey > /etc/wireguard/server_public.key
#
# Start:  sudo wg-quick up wg0
# Stop:   sudo wg-quick down wg0
# Enable on boot: sudo systemctl enable wg-quick@wg0

[Interface]
PrivateKey = <SERVER_PRIVATE_KEY>      # content of server_private.key
Address = 10.0.0.1/24
ListenPort = 51820

# Allow IP forwarding so clients can route internet traffic through this server:
PostUp   = iptables -A FORWARD -i %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# Add one [Peer] block for each client
[Peer]
PublicKey = <CLIENT_PUBLIC_KEY>        # content of the client's public key
AllowedIPs = 10.0.0.2/32
