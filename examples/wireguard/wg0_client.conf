# WireGuard client configuration
# On Windows: paste into WireGuard → Add Tunnel → Create from scratch
# On Linux:   place at /etc/wireguard/wg0.conf and run: sudo wg-quick up wg0
#
# Generate keys (Windows PowerShell, requires WireGuard installed):
#   wg genkey > client_private.key
#   Get-Content client_private.key | wg pubkey > client_public.key
#
# Generate keys (Linux):
#   wg genkey | tee client_private.key | wg pubkey > client_public.key

[Interface]
PrivateKey = <CLIENT_PRIVATE_KEY>      # content of client_private.key
Address = 10.0.0.2/32
DNS = 1.1.1.1

# --- WireGuard bypass for QS-Tunnel (Linux only) ---
# When AllowedIPs = 0.0.0.0/0 all traffic is routed through WireGuard, which
# would also capture QS-Tunnel's own connections (VLESS WebSocket, registration
# UDP, keep-alive UDP) and cause a routing loop.
#
# The rule below tells the kernel: packets whose SO_MARK equals 51821 should
# be looked up in the *main* routing table (the real internet), not through
# WireGuard.  Set "fwmark": 51821 (or any unique non-zero value) in
# qs_tunnel_client.json to enable this on the QS-Tunnel side.
# QS-Tunnel must be run as root or with CAP_NET_ADMIN for SO_MARK to work.
PostUp  = ip rule add fwmark 51821 table main priority 100
PreDown = ip rule del fwmark 51821 table main priority 100

[Peer]
PublicKey = <SERVER_PUBLIC_KEY>        # content of server_public.key (from the server)
AllowedIPs = 0.0.0.0/0, ::/0          # route all traffic through the tunnel

# IMPORTANT: Point to QS-Tunnel's h_in_address — NOT the real server IP.
# QS-Tunnel client must be running and listening on this address.
Endpoint = 127.0.0.1:10443
